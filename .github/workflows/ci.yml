name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Retrieve the immutable complete arithmetic observations
        uses: actions/checkout@v7
        with:
          repository: kimjooyoon/gooo-neural-decision-experiments
          ref: 600dc282fb059918c0fd6588d955d3a56c380b58
          path: .replay-reference
          persist-credentials: false
          sparse-checkout: publication/full-input-separate-arithmetic-20261003
      - name: Replay every explicit model using the public SDK
        run: |
          go run ./examples/three-replay \
            --bundle .replay-reference/publication/full-input-separate-arithmetic-20261003 \
            --source-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/sdk-full-input-replay.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdk-full-input-replay
          path: ${{ runner.temp }}/sdk-full-input-replay.json
          if-no-files-found: error
      - uses: actions/checkout@v7
        with:
          repository: kimjooyoon/gooo-neural-decision-experiments
          ref: 8a41bb0f825dfd3f950101b33491581492c740f6
          path: .order-reference
          persist-credentials: false
          sparse-checkout: publication/order-judge-initial-20261003
      - name: Replay whole-candidate ranking and every finite search result
        run: |
          root=.order-reference/publication/order-judge-initial-20261003
          (cd "$root" && sha256sum -c SHA256SUMS)
          unzip -q "$root/initial.zip" -d "$RUNNER_TEMP/order-initial"
          unzip -q "$root/runtime.zip" -d "$RUNNER_TEMP/order-original"
          go build -trimpath -o "$RUNNER_TEMP/order-sdk-replay" ./examples/order-replay
          "$RUNNER_TEMP/order-sdk-replay" --input "$RUNNER_TEMP/order-initial" --output "$RUNNER_TEMP/order-sdk"
          jq -S 'map(del(.SearchNS) | .Ranking |= del(.predict_ns))' "$RUNNER_TEMP/order-original/records.json" > "$RUNNER_TEMP/order-original.json"
          jq -S 'map(del(.SearchNS) | .Ranking |= del(.predict_ns))' "$RUNNER_TEMP/order-sdk/records.json" > "$RUNNER_TEMP/order-sdk.json"
          cmp "$RUNNER_TEMP/order-original.json" "$RUNNER_TEMP/order-sdk.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdk-whole-candidate-replay
          path: ${{ runner.temp }}/order-sdk
          if-no-files-found: error
      - name: Replay prepared candidates against every original search record
        run: |
          go build -trimpath -o "$RUNNER_TEMP/order-prepared-replay" ./examples/order-prepared
          "$RUNNER_TEMP/order-prepared-replay" --input "$RUNNER_TEMP/order-initial" \
            --output "$RUNNER_TEMP/order-prepared" --repeats 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdk-prepared-candidate-replay
          path: ${{ runner.temp }}/order-prepared
          if-no-files-found: error
