name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Audit retained role-learning observations without model execution
        run: |
          root=studies/canonical-role-learning-20261011/result
          (cd "$root" && sha256sum -c SHA256SUMS)
          go run ./studies/canonical-role-learning-20261011/audit "$root" > "$RUNNER_TEMP/role-audit.json"
          cmp "$RUNNER_TEMP/role-audit.json" "$root/audit.json"
      - name: Audit retained source-relative observations without model execution
        run: |
          root=studies/source-relative-learning-20261011/result
          (cd "$root" && sha256sum -c SHA256SUMS)
          go run ./studies/source-relative-learning-20261011/audit "$root" > "$RUNNER_TEMP/relative-audit.json"
          cmp "$RUNNER_TEMP/relative-audit.json" "$root/audit.json"
      - name: Race tests
        run: go test -race ./...
      - name: Diagnose frozen factorized inputs without model execution
        run: |
          study=studies/factorized-input-diagnosis-20261012
          bash "$study/fetch.sh" "$RUNNER_TEMP/factorized-inputs"
          go run "./$study/audit" "$RUNNER_TEMP/factorized-inputs" > "$RUNNER_TEMP/factorized-diagnosis.json"
          cmp "$RUNNER_TEMP/factorized-diagnosis.json" "$study/diagnosis.json"
      - name: Audit retained V4 paired outcomes without fitting or prediction
        run: bash studies/branch-owned-learning-20261012/check-retained.sh
      - name: Audit retained V2 return-layout observations without model execution
        run: |
          root=studies/return-layout-learning-20261012/result
          (cd "$root" && sha256sum -c SHA256SUMS)
          go run ./studies/return-layout-learning-20261012/audit "$root" > "$RUNNER_TEMP/layout-audit.json"
          cmp "$RUNNER_TEMP/layout-audit.json" "$root/audit.json"
      - name: Retrieve pinned compiler for source-relative producer fixtures
        uses: actions/checkout@v7
        with:
          repository: kimjooyoon/meta-ontology-go
          ref: 67ee67c7cf0cdeb22f4caead87144dfb19f29d54
          path: .source-relative-compiler
          persist-credentials: false
      - name: Check source-relative producer without original model execution
        run: |
          cd studies/source-relative-learning-20261011/producer
          cp go.mod "$RUNNER_TEMP/source-relative.mod"
          go mod edit -modfile="$RUNNER_TEMP/source-relative.mod" \
            -go=1.27.3 \
            -replace="github.com/kimjooyoon/meta-ontology-go=$GITHUB_WORKSPACE/.source-relative-compiler" \
            -replace="github.com/kimjooyoon/gooo-decision-runtime=$GITHUB_WORKSPACE"
          go mod tidy -modfile="$RUNNER_TEMP/source-relative.mod"
          go vet -modfile="$RUNNER_TEMP/source-relative.mod" ./...
          go test -race -modfile="$RUNNER_TEMP/source-relative.mod" ./...
      - name: Retrieve the immutable complete arithmetic observations
        uses: actions/checkout@v7
        with:
          repository: kimjooyoon/gooo-neural-decision-experiments
          ref: 600dc282fb059918c0fd6588d955d3a56c380b58
          path: .replay-reference
          persist-credentials: false
          sparse-checkout: publication/full-input-separate-arithmetic-20261003
      - name: Replay every explicit model using the public SDK
        run: |
          go run ./examples/three-replay \
            --compatibility-only \
            --bundle .replay-reference/publication/full-input-separate-arithmetic-20261003 \
            --source-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/sdk-full-input-replay.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdk-full-input-replay
          path: ${{ runner.temp }}/sdk-full-input-replay.json
          if-no-files-found: error
      - uses: actions/checkout@v7
        with:
          repository: kimjooyoon/gooo-neural-decision-experiments
          ref: 8a41bb0f825dfd3f950101b33491581492c740f6
          path: .order-reference
          persist-credentials: false
          sparse-checkout: publication/order-judge-initial-20261003
      - name: Replay whole-candidate ranking and every finite search result
        run: |
          root=.order-reference/publication/order-judge-initial-20261003
          (cd "$root" && sha256sum -c SHA256SUMS)
          unzip -q "$root/initial.zip" -d "$RUNNER_TEMP/order-initial"
          unzip -q "$root/runtime.zip" -d "$RUNNER_TEMP/order-original"
          go build -trimpath -o "$RUNNER_TEMP/order-sdk-replay" ./examples/order-replay
          "$RUNNER_TEMP/order-sdk-replay" --compatibility-only --input "$RUNNER_TEMP/order-initial" --output "$RUNNER_TEMP/order-sdk"
          jq -S 'map(del(.SearchNS) | .Ranking |= del(.predict_ns))' "$RUNNER_TEMP/order-original/records.json" > "$RUNNER_TEMP/order-original.json"
          jq -S 'map(del(.SearchNS) | .Ranking |= del(.predict_ns))' "$RUNNER_TEMP/order-sdk/records.json" > "$RUNNER_TEMP/order-sdk.json"
          cmp "$RUNNER_TEMP/order-original.json" "$RUNNER_TEMP/order-sdk.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdk-whole-candidate-replay
          path: ${{ runner.temp }}/order-sdk
          if-no-files-found: error
      - name: Replay prepared candidates against every original search record
        run: |
          go build -trimpath -o "$RUNNER_TEMP/order-prepared-replay" ./examples/order-prepared
          "$RUNNER_TEMP/order-prepared-replay" --compatibility-only --input "$RUNNER_TEMP/order-initial" \
            --output "$RUNNER_TEMP/order-prepared" --repeats 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdk-prepared-candidate-replay
          path: ${{ runner.temp }}/order-prepared
          if-no-files-found: error
